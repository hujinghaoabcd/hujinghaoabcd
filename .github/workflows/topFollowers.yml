name: Get Top Followers

on:
  push:
    branches:
      - master
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:

jobs:
  top-followers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: Install requests
        run: pip install requests
      - name: Update README
        run: python src/getTopFollowers.py ${{ github.repository_owner }} ${{ secrets.GITHUB_TOKEN }} README.md
      - name: Keep fixed GIF banner
        run: |
          python - <<'PY'
          from pathlib import Path

          gif = "https://cdn.jsdelivr.net/gh/hujinghaoabcd/hujinghaoabcd@904d9f92007de9da2ece09b6304374552edbde1a/assets/banner.gif"
          for name in ("README.md", "README_CN.md"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("assets/profile-banner-pixel.png", gif)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update profile followers"
      - name: Pull changes
        run: git pull -r
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
